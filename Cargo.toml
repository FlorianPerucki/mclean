[package]
name = "mclean"
version = "0.1.0"
edition = "2024"
description = "Nettoyeur macOS open source en ligne de commande (TUI)"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
jwalk = "0.9.0"
plist = "1.10.4"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
trash = "5.4.0"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
